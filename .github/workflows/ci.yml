name: ADEI CI/CD Pipeline

on:
  push:
    branches: [main, master, emproving-the-project]
  pull_request:
    branches: [main, master]

jobs:
  # ========================================================
  # Job 1 : Validation Complète du Backend
  # ========================================================
  backend-ci:
    name: Backend CI (TypeScript + Migrations + Jest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adei_pg_user
          POSTGRES_PASSWORD: change_me_postgres_password
          POSTGRES_DB: adei_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    env:
      NODE_ENV: test
      DB_DIALECT: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: adei_test
      DB_USER: adei_pg_user
      DB_PASSWORD: change_me_postgres_password
      JWT_SECRET: super_secure_ci_jwt_secret_key_minimum_32_characters_long
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      ADMIN_USERNAME: ci_admin
      ADMIN_EMAIL: ci_admin@adei-ensaf.ma
      ADMIN_PASSWORD: SecureAdminPassword123!

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: ⚙️ Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 📦 Installer les dépendances du serveur
        run: npm ci

      - name: 🔍 Compilation & Vérification des Types (tsc)
        run: npm run build

      - name: 🗄️ Exécuter les Migrations sur la base de test
        run: npx sequelize-cli db:migrate

      - name: 🧪 Lancer la suite de tests automatisés (Jest + Supertest)
        run: npm test

  # ========================================================
  # Job 2 : Compilation du Frontend v2
  # ========================================================
  frontend-ci:
    name: Frontend CI (TypeScript + Vite Production Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-v2

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: ⚙️ Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - name: 📦 Installer les dépendances du frontend
        run: npm ci

      - name: 🏗️ Compiler pour la Production (tsc + Vite Build)
        run: npm run build