services:
  mysql:
    image: mysql:8.0
    container_name: adei_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-adei_db}
      MYSQL_USER: ${MYSQL_USER:-adei_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-adei_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backups:/backups
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - adei_network

  postgres:
    image: postgres:16-alpine
    container_name: adei_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adei_pg}
      POSTGRES_USER: ${POSTGRES_USER:-adei_pg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adei_pg_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adei_pg_user} -d ${POSTGRES_DB:-adei_pg}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adei_network

  adminer:
    image: adminer:latest
    container_name: adei_adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - adei_network

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: dev
    container_name: adei_api
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: ${API_PORT:-5001}
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-adei_db}
      DB_USER: ${MYSQL_USER:-adei_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-adei_password}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_jwt_secret_key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    volumes:
      - ./server:/app
      - /app/node_modules
      - api_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - adei_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adei_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5001}
      REACT_APP_ENV: ${REACT_APP_ENV:-development}
      GENERATE_SOURCEMAP: ${GENERATE_SOURCEMAP:-true}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    stdin_open: true
    tty: true
    networks:
      - adei_network

volumes:
  mysql_data:
  postgres_data:
  api_uploads:

networks:
  adei_network:
    driver: bridge